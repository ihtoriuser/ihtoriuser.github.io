<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTS Studio 201</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <!-- ТРИГГЕР МЕНЮ -->
    <div class="menu-trigger" id="menuTrigger"></div>

    <!-- ВЕРХНЕЕ МЕНЮ -->
    <nav class="top-nav" id="topNav">
        <div class="logo">MTS Studio 201</div>
        <div class="nav-items">
            <button onclick="app.switchMethod('cinquain')" class="nav-btn">1. Синквейн</button>
            <button onclick="app.switchMethod('cluster')" class="nav-btn active">2. Кластер</button>
            <button onclick="app.switchMethod('mindmap')" class="nav-btn">3. Ментальная карта</button>
            <button onclick="app.switchMethod('tchart')" class="nav-btn">4. Т-схема</button>
            <button onclick="app.switchMethod('scamper')" class="nav-btn">5. SCAMPER</button>
            <button onclick="app.switchMethod('venn')" class="nav-btn">6. Диаграмма Венна</button>
            <button onclick="app.switchMethod('fishbone')" class="nav-btn">7. Скелет рыбы</button>
            <button onclick="app.switchMethod('fan')" class="nav-btn">8. Веер</button>
            <button onclick="app.switchMethod('lotus')" class="nav-btn">9. Цветок лотоса</button>
        </div>
    </nav>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main class="main-area">
        <div id="canvasContainer" class="canvas-box"></div>
    </main>

    <!-- КНОПКИ -->
    <div class="fab-container">
        <button class="fab btn-reset" onclick="app.reset()" title="Сбросить">↺</button>
        <button class="fab btn-edit" onclick="app.openModal()" title="Редактировать">✏️ Редактировать</button>
        <button class="fab btn-download" onclick="app.download()" title="Скачать PNG">📸 Скачать</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="editorModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Редактор данных</h2>
                <button class="close-btn" onclick="app.closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p class="hint">Сохраняйте структуру текста и разделителей:</p>
                <textarea id="dataInput" class="large-input" spellcheck="false"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-save" onclick="app.saveAndRender()">Сохранить и Построить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
